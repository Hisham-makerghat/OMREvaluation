name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.dev.txt
      - run: pip install -r backend/requirements.dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          CI: "true"
      - name: Bundle the built page with the backend
        run: |
          rm -rf backend/static_site
          cp -r frontend/build backend/static_site
          rm -rf backend/.venv backend/data backend/tests
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend
          include-hidden-files: false

  deploy:
    # Deploys to Azure App Service on every push to main, and when the workflow is run by hand
    # on main (Actions > Test and deploy > Run workflow) to redeploy without a new commit.
    # Needs the repository secret AZURE_WEBAPP_PUBLISH_PROFILE and the variable AZURE_WEBAPP_NAME
    # (see docs/AZURE_SETUP.md).
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
